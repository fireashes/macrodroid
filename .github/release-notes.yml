changelog:
  categories:
    - title: "🚀 New Features"
      labels:
        - feature
        - enhancement
    - title: "🐛 Bug Fixes"
      labels:
        - bug
        - fix
    - title: "📝 Documentation Updates"
      labels:
        - documentation
        - docs
    - title: "🧰 Maintenance & Dependencies"
      labels:
        - dependency
        - maintenance
        - chore
  exclude:
    labels:
      - skip-changelog
    authors:
      - dependabot[bot]
